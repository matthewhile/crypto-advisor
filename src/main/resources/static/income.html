    <head>
        <meta charset="UTF-8">
        <title>Net Income</title>

        <div id="navbar"></div>
        <div class="content">
            <h1>Budget Calculator Page</h1>
            <p>Content goes here...</p>
        </div>
        <div class="container">
            <div class="row">
                <div id="userExpenses" class="col-md-6">
                    <h4>Monthly Expense Categories:</h4>
                    <form id="expenseForm" class="mb-3">
                        <div class="input-group mb-2">
                            <span class="input-group-text">Category:</span>
                            <input id="categoryName" type="text" class="form-control">
                        </div>
                        <div class="input-group mb-2">
                            <span class="input-group-text">Amount:</span>
                            <input id="expenseAmount" type="number" class="form-control">
                        </div>
                        <button id="addExpenseBtn" type="button" class="btn btn-primary">Add</button>
                    </form>
                    <div class="h5">Total: $890</div>
                    <table id="expenseTable" class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Expense Category</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Food</td>
                                <td>$250</td>
                                <td>
                                    <button id="editExpenseBtn" class="btn edit-btn">
                                        <i class="fa-solid fa-pencil"></i>
                                    </button>
                                    <button id="deleteExpenseBtn" class="btn delete-btn">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </td>
                                
                            </tr>
                            <tr>
                                <td>Bills</td>
                                <td>$500</td>
                                <td>
                                    <button id="editExpenseBtn" class="btn edit-btn">
                                        <i class="fa-solid fa-pencil"></i>
                                    </button>
                                    <button id="deleteExpenseBtn" class="btn delete-btn">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>Subscriptions</td>
                                <td>$140</td>
                                <td>
                                    <button id="editExpenseBtn" class="btn edit-btn">
                                        <i class="fa-solid fa-pencil"></i>
                                    </button>
                                    <button id="deleteExpenseBtn" class="btn delete-btn">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                

<!-- ------------------------------------------------------------------------------------ -->

                
                <div id="netIncome" class="col-md-6">
                    <h4>Net Income:</h4>
                    <form id="netIncomeForm">
                        <div class="form-group">
                            <label for="grossIncome">Annual Income:</label>
                            <input type="number" class="form-control" id="grossIncome" placeholder="Enter Income">
                        </div>  
                        <div class="form-group">
                            <label for="states">State:</label>
                            <select id="states">
                                <option value="">-- Select a State --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="filing-status">Filing Status:</label>
                            <select id="filingStatus">
                                <option value="">-- Select a Status --</option>
                                <option value="">Single</option>
                                <option value="">Married Filing Jointly</option>
                                <option value="">Married Filing Separately</option>
                                <option value="">Head of Household</option>
                                <option value="">Qualifying Widow(er)</option>
                            </select>
                        </div> 
                        <button id="netIncomeBtn" type="button" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </div>
