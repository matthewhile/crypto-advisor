<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>User Preferences</title>
        
        <link rel="stylesheet" href="css/styles.css">
    	<script src="js/navbar.js" defer></script>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    	
    </head>
    <body id="preferences">
    
        <div id="navbar"></div>
        
        <div class="content">
            <h1 class="text-center"> User Preferences Page</h1>
        </div>

		<div class="form-container">			
			
			<form id="preferencesForm">			
				<div class="form-group">
					<label for="riskTolerance">Risk Tolerance:</label>
					<select id="riskTolerance">
						<option value="0">-- Select a Risk Level --</option>
						<option value="High">High</option>
						<option value="Medium">Medium</option>
						<option value="Low">Low</option>
					</select>
				</div>						
				<div class="form-group">
					<label for ="timeHeld">Time to Invest:</label>
					<select id="timeHeld">
						<!-- value attributes are set 1 - 5 for now, will be changed for scoring algorithm -->
						<option value="0">-- Select a Time Frame --</option>
						<option value="">Less than 1 week</option>
						<option value="">1 week to 1 month</option>
						<option value="">1 to 6 months</option>
						<option value="">6 months to 1 year</option>
						<option value="">1 to 5 years</option>
						<option value="">5+ years</option>					
					</select>
				</div>	
				<div class="form-group">
					<label for="investmentAmount">Amount to Invest:</label>
					<input id="investmentAmount" type="number" class="form-control" placeholder="Enter amount">				
				</div>
	
				<button id="preferenceFormBtn" type="button" class="btn btn-primary">Submit</button>			
			</form>
		</div>
                
    </body>
</html>
