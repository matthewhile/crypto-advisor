<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crypto Recommendations</title>
    <script src="js/navbar.js" defer></script>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preload" as="image" href="../images/void.jpg">

</head>
<body id = recommend>
    <div id="navbar"></div>
    <div class="content">
        <h1 class="text-center page-title">Crypto Recommendations</h1>
    </div>
    <div class="container mt-5">
        <div><button id="recommendationsBtn" class="crypto-btn">Generate Recommendations</button></div>
        <div id="recAlertBox" class="error-alert hidden">
            <div id="recErrorMessage"></div>
        </div>

        <!-- <h1 class="text-center mt-7 mb-5 pt-5">Crypto Recommendations</h1> -->
        <div class="row">
            <div id="cryptoContainer" class="col-md-6"></div>
            <div id="cryptoExplanation" class="col-md-6">
            </div>
        </div>
        <table id="savedRecommendationTable" class="table table-bordered">
            <thead class="table-light">
                <tr class="savedRecTitle">
                    <th id="savedRecTitle" colspan="4">Saved Recommendations</th>
                </tr>
                <tr>
                    <th>Name</th>
                    <th>Symbol</th>
                    <th>Date Saved</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody id="savedRecommendationTableBody"></tbody>
        </table>
    </div>
    <script src="js/recommendations.js"></script>
</body>
</html>
