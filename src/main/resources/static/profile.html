<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <title>Profile</title>
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/navbar.js" defer></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="preload" as="image" href="../images/space.jpg">
    </head>
    <body id="profile">
        <div id="navbar"></div>
            <div class="content">
                <h1 class="text-center page-title">Profile</h1>
            </div>
        <div id="profileContainer">
            <div class="card">
                <div class="card-header profile-title">Account Info</div>
                <div class="card-body">
                    <p class="card-text">Username: <span id="username"></span> 
                        <!-- <button id="editExpenseBtn" class="btn edit-btn">
                            <i class="fa-solid fa-pencil"></i>
                        </button> -->
                    </p>
                    <p class="card-text">Email: <span id="email"></span> 
                        <!-- <button id="editExpenseBtn" class="btn edit-btn">
                            <i class="fa-solid fa-pencil"></i>
                        </button> -->
                    </p>
                </div>
            </div>
        
            <div class="card">
                <div class="card-header profile-title">Finances / Tax info</div>
                <div class="card-body">
                    <p>Net Income: $<span id="profileNetIncome"></span></p>
                    <p>Annual (gross) income: $<span id="grossIncome"></span></p>
                    <p>Filing Status: <span id="filingStatus"></span></p>
                    <p>State: <span id="state"></span></p> 
                    <a href="income.html" class="profile-edit-btn crypto-btn">Edit</a>
                </div>
            </div>
        
            <div class="card">
                <div class="card-header profile-title">Investment Preferences</div>
                <div class="card-body">
                    <p>Amount to Invest: $<span id="investmentAmount"></span></p> 
                    <p>Investment Time Frame: <span id="timeFrame"></span></p>     
                    <p>Investment Frequency: <span id="frequency"></span></p>     
                    <p>Risk Tolerance: <span id="riskTolerance"></span></p>
                    <a href="preferences.html" class="profile-edit-btn crypto-btn">Edit</a>
                </div>
            </div>
        </div>
        <script src="js/profile.js" defer></script> 
    </body>
</html>
