<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>User Preferences</title>
        
        <link rel="stylesheet" href="css/styles.css">
    	<script src="js/navbar.js" defer></script>      
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    	
    </head>
    <body id="preferences">
    
        <div id="navbar"></div>
        
        <div class="content">
            <h1 class="text-center"> Investment Preferences</h1>
        </div>

		<div class="preference-form-container">
			<h4>My Preferences</h4>			
			<form id="preferencesForm">		
				<div class="form-group">
					<label for="investmentAmount">Amount to Invest:</label>
					<input id="investmentAmount" type="number" class="form-control" placeholder="Enter amount" required>				
				</div>	
				<div class="form-group">
					<label for ="timeFrame">Investment Time Frame:</label>
					<select id="timeFrame" required>
						<option value="">-- Select a Time Frame --</option>
						<option value="Short-term">Short-term (Less than 1 month)</option>
 						<option value="Medium-term">Medium-term (1 month to 1 year)</option>
 						<option value="Long-term">Long-term (More than 1 year)</option>
					</select>
				</div>	
				<div class="form-group">
					<label for="frequency">Investment Frequency:</label>
					<select id="frequency" required>
						<option value="">-- Select a Frequency --</option>
						<option value="Daily">Daily</option>
 						<option value="Weekly">Weekly</option>
 						<option value="Monthly">Monthly</option>
 						<option value="Yearly">Yearly</option>
 						<option value="One-time Investment">One-time Investment</option>		
					</select>
				</div>	
				<div class="form-group">
					<label for="riskTolerance">Risk Tolerance:</label>
					<select id="riskTolerance" required>
						<option value="">-- Select a Risk Level --</option>
						<option value="Low">Low</option>
 						<option value="Medium">Medium</option>
						<option value="High">High</option>
					</select>
				</div>						
				<div id="preferenceSuccess">Preferences saved successfully!</div>
				<div id="preferenceError">Failed to save preferences!</div>
				<button id="preferenceFormBtn" type="submit" class="crypto-btn">Submit</button>			
			</form>
		</div>
		<script src="js/preferences.js" defer></script>        
    </body>
</html>
