<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Signup Form</title>
        <link rel="stylesheet" href="css/styles.css">
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <link rel="preload" as="image" href="../images/bitcoin2.jpg">
    </head>

    <body id="registerPage">
        <div id="loginPageBanner">
            <div class="static-logo">Crypto Advisor</div>
        </div>
        <section>
            <form id="registerForm" action="/api/register" method="post">
                <h1>Sign Up</h1>

                <div class="inputbox">
                    <div class="label-icon">
                        <label>User Name</label>
                        <ion-icon name="person-outline"></ion-icon>
                    </div>
                    <input type="text" id="username" placeholder="Create Username" required>
                </div>

                <div class="inputbox">
                    <div class="label-icon">
                        <label for="email">Email</label>
                        <ion-icon name="mail-outline"></ion-icon></span>
                    </div>
                    <input type="email" id="email" placeholder="Enter Email" required>
                </div>

                <div class="inputbox">
                    <div class="label-icon">
                        <label for="password">Password</label>
                        <ion-icon name="lock-closed-outline"></ion-icon>
                    </div>
                    <input type="password" id="password" placeholder="Create Password" required>
                </div>

                <div class="inputbox">
                    <div class="label-icon">
                        <label for="passwordcon">Confirm Password</label>
                        <ion-icon name="lock-closed-outline"></ion-icon>
                    </div>
                    <input type="password" id="passwordcon" placeholder="Re-type Password" required>
                </div>

                <button id="signUpBtn" type="button">Sign Up</button>

                <div class="register">
                    <h4>Already have an account? <a href="/login.html">Log In</a></h4>
                </div>
            </form>
            <script src="js/register.js"></script>
        </section>
    </body>
</html>
