<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Net Income</title>
        <script src="js/navbar.js" defer></script>
        <script src="js/income.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="css/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body id="netIncomePage">
        <div id="navbar"></div>
        <div class="content">
            <h1 class="text-center">Expenses & Net Income</h1>
        </div>
        <div class="container">
            <div class="row">
                <div id="userExpenses" class="col-md-6">
                    <form id="addExpenseForm" class="mb-3">
                        <h4 class="text-center">Add Monthly Expense Categories</h4>
                        <div class="form-group">
                            <label for="categoryName">Expense Category Name:</label>
                            <input id="categoryName" type="text" class="form-control" placeholder="Enter Category Name" required>
                        </div>
                        <div class="form-group">
                            <label for="expenseAmount">Expense Amount:</label>
                            <input id="expenseAmount" type="number" class="form-control" placeholder="Enter Amount" required>
                        </div>
                        <button id="addExpenseBtn" type="submit" class="crypto-btn">Add</button>
                    </form>
                    <table id="expenseTable" class="table table-bordered">
                        <div class="h5">Total: <span id="totalExpense">$0.00</span></div>
                        <thead class="table-light">
                            <tr>
                                <th>Expense Category</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBody"></tbody>
                    </table>
                </div>
                

<!-- ------------------------------------------------------------------------------------ -->

                
                <div id="netIncome" class="col-md-6">
                    <form id="netIncomeForm">
                        <h4 class="text-center">Calculate Net Income</h4>
                        <div class="form-group">
                            <label for="grossIncome">Annual Income:</label>
                            <input type="number" class="form-control" id="grossIncome" placeholder="Enter Income" required>
                        </div>  
                        <div class="form-group">
                            <label for="state">State:</label>
                            <select id="state" required>
                                <option value="">-- Select a State --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="filing-status">Filing Status:</label>
                            <select id="filingStatus" required>
                                <option value="">-- Select a Status --</option>
                            </select>
                        </div> 
                        <button id="netIncomeBtn" type="submit" class="crypto-btn">Submit</button>
                    </form>
                    <div>
                        <p class="h5 mt-5">Estimated Net Income: </p>
                    </div>
                </div>
            </div>
        </div>

         
        <div class="modal fade" id="editExpenseModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Edit Expense</h5>
                        <button id="expenseModalCloseBtn" type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="editExpenseForm" class="mb-3">
                            <div class="form-group">
                                <label for="editCategoryName">Category:</label>
                                <input id="editCategoryName" type="text" class="form-control" placeholder="Enter Name" required>
                            </div>
                            <div class="form-group">
                                <label for="editExpenseAmount">Amount:</label>
                                <input id="editExpenseAmount" type="number" class="form-control" placeholder="Enter Amount" required>
                            </div>

                            <button id="saveEditExpenseBtn" type="submit" class="crypto-btn">Save changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>           
    </body>
</html>
