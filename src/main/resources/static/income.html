<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Net Income</title>
        <script src="js/navbar.js" defer></script>
        <link rel="stylesheet" href="css/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        <div id="navbar"></div>
        <div class="content">
            <h1>Budget Calculator Page</h1>
            <p>Content goes here...</p>
        </div>
        <div class="container">
            <div class="row">
                <div id="net-income" class="col-md-6">
                    <h4>Net Income:</h4>
                    <form id="net-income-form">
                        <div class="form-group">
                            <label>Annual Income:</label>
                            <input type="number" class="form-control" id="gross-income" placeholder="Enter Income">
                          </div>
                    </form>
                </div>

<!-- ------------------------------------------------------------------------------------ -->

                <div id="user-expenses" class="col-md-6">
                    <h4>Monthly Expense Categories:</h4>
                    <form id="expense-form" class="mb-3">
                        <div class="input-group mb-2">
                            <span class="input-group-text">Category:</span>
                            <input id="category-name" type="text" class="form-control">
                        </div>
                        <div class="input-group mb-2">
                            <span class="input-group-text">Amount:</span>
                            <input id="expense-amount" type="number" class="form-control">
                        </div>
                        <button id="add-expense-btn" type="button" class="btn btn-primary">Add</button>
                    </form>
                    <div class="h5">Total: $890</div>
                    <table id="expense-table" class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Expense Category</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Food</td>
                                <td>$250</td>
                                <td>
                                    <button id="edit-expense-btn" class="btn edit-btn">
                                        <i class="fa-solid fa-pencil"></i>
                                    </button>
                                    <button id="delete-expense-btn" class="btn delete-btn">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </td>
                                
                            </tr>
                            <tr>
                                <td>Bills</td>
                                <td>$500</td>
                                <td>
                                    <button id="edit-expense-btn" class="btn edit-btn">
                                        <i class="fa-solid fa-pencil"></i>
                                    </button>
                                    <button id="delete-expense-btn" class="btn delete-btn">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td>Subscriptions</td>
                                <td>$140</td>
                                <td>
                                    <button id="edit-expense-btn" class="btn edit-btn">
                                        <i class="fa-solid fa-pencil"></i>
                                    </button>
                                    <button id="delete-expense-btn" class="btn delete-btn">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>          
    </body>
</html>
