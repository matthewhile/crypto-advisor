<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>User Preferences</title>
        
        <link rel="stylesheet" href="css/styles.css">
    	<script src="js/navbar.js" defer></script>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    	
    </head>
    <body id = "preferences">
    
        <div id="navbar"></div>
        
        <div class="content">
            <h1 class= "text-center"> User Preferences Page</h1>
        </div>
        

        <label id="Risk" for="Risk Tolerance">Risk Tolerance:</label>

		<select name="Risk Tolerance" id="Tolerance">
  			<option value="High">High</option>
  			<option value="Medium">Medium</option>
  			<option value="Low">Low</option>
		</select>
		
		
		
		<label id ="Invest" for ="Time to Invest">Time to Invest:</label>
		<select name="Time to Invest" id="Time">
  			<option value="0-1 Days">0-1 Days</option>
  			<option value="2-4 Days">2-4 Days</option>
  			<option value="5-7 Days">5-7 Days</option>
  			<option value="1-2 Weeks">1-2 Weeks</option>
  			<option value="2-4 Weeks">2-4 Weeks</option>
  			
		</select>
		
		
		<div class="input-box" id="Amount">
                    <input id="Amount" type="number" placeholder="Money to Invest" required>
                 </div>
                
    </body>
</html>
