<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Username Recovery</title>
		<link rel="stylesheet" href="css/styles.css">
	    <script src="js/navbar.js" defer></script>
				
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	</head>
	<body>
		<div id="loginPageBanner">
			<div class="logo">Crypto Advisor</div>
		</div>
		<div class="content">
			<h1 class="text-center">Username Recovery</h1>
		</div>
		<div class="form-container">
			<form id="usernameRecoveryForm">
				<div class="form-group">
					<label for="recoveryEmail">Enter Email:</label>
					<input id="recoveryEmail" type="text" class="username-recovery" placeholder="Email" required>				
				</div>

				<button type="submit" class="btn btn-primary">Submit</button>	
			</form>
		</div>
	</body>
</html>
